<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 376" width="880" role="img">
  <title>dotfiles system context</title>
  <desc>The owner runs make targets and other developers copy skills and config; the dotfiles repo symlinks configs into the home directory, links skills into Claude Code and Cursor, installs packages with Homebrew and npm, and audits and hardens GitHub repos.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
  </defs>

  <g class="s-gray">
    <rect x="190" y="30" width="200" height="48" rx="24"/>
    <text class="th" x="290" y="45" text-anchor="middle" dominant-baseline="central">Owner</text>
    <text class="ts" x="290" y="64" text-anchor="middle" dominant-baseline="central">sets up a new Mac</text>
  </g>
  <g class="s-gray">
    <rect x="490" y="30" width="200" height="48" rx="24"/>
    <text class="th" x="590" y="45" text-anchor="middle" dominant-baseline="central">Other developers</text>
    <text class="ts" x="590" y="64" text-anchor="middle" dominant-baseline="central">borrow skills and config</text>
  </g>

  <g class="s-purple">
    <rect x="330" y="160" width="220" height="56" rx="8"/>
    <text class="th" x="440" y="179" text-anchor="middle" dominant-baseline="central">dotfiles</text>
    <text class="ts" x="440" y="199" text-anchor="middle" dominant-baseline="central">Makefile, configs, skills</text>
  </g>

  <g class="s-gray">
    <rect x="31" y="300" width="185" height="56" rx="8"/>
    <text class="th" x="123.5" y="319" text-anchor="middle" dominant-baseline="central">Home directory</text>
    <text class="tm" x="123.5" y="339" text-anchor="middle" dominant-baseline="central">~/.zshrc  ~/.vimrc</text>
  </g>
  <g class="s-blue">
    <rect x="242" y="300" width="185" height="56" rx="8"/>
    <text class="th" x="334.5" y="319" text-anchor="middle" dominant-baseline="central">Agent tools</text>
    <text class="ts" x="334.5" y="339" text-anchor="middle" dominant-baseline="central">Claude Code, Cursor</text>
  </g>
  <g class="s-gray">
    <rect x="453" y="300" width="185" height="56" rx="8"/>
    <text class="th" x="545.5" y="319" text-anchor="middle" dominant-baseline="central">Homebrew and npm</text>
    <text class="ts" x="545.5" y="339" text-anchor="middle" dominant-baseline="central">packages and CLIs</text>
  </g>
  <g class="s-gray">
    <rect x="664" y="300" width="185" height="56" rx="8"/>
    <text class="th" x="756.5" y="319" text-anchor="middle" dominant-baseline="central">GitHub</text>
    <text class="ts" x="756.5" y="339" text-anchor="middle" dominant-baseline="central">repos, via gh CLI</text>
  </g>

  <path class="arr" d="M290 78 V188 H330" marker-end="url(#a)"/>
  <text class="ts" x="298" y="122" dominant-baseline="central">runs make targets</text>
  <path class="arr" d="M590 78 V188 H550" marker-end="url(#a)"/>
  <text class="ts" x="582" y="122" text-anchor="end" dominant-baseline="central">copy skills and config</text>

  <path class="arr" d="M350 216 V236 H123.5 V300" marker-end="url(#a)"/>
  <text class="ts" x="130" y="278" dominant-baseline="central">symlinks configs</text>
  <path class="arr" d="M400 216 V256 H334.5 V300" marker-end="url(#a)"/>
  <text class="ts" x="341" y="278" dominant-baseline="central">links skills</text>
  <path class="arr" d="M480 216 V256 H545.5 V300" marker-end="url(#a)"/>
  <text class="ts" x="552" y="278" dominant-baseline="central">installs packages</text>
  <path class="arr" d="M530 216 V236 H756.5 V300" marker-end="url(#a)"/>
  <text class="ts" x="763" y="278" dominant-baseline="central">manages repos</text>
</svg>
