  <title>dotfiles system context</title>
  <desc>The owner runs make targets and other developers copy skills and config; the dotfiles repo symlinks configs into the home directory, links skills into Claude Code and Cursor, installs packages with Homebrew and npm, and audits and hardens GitHub repos.</desc>
