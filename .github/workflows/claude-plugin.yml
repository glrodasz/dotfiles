# Publishes the skills in skills/claude-plugin-skills.yaml as a Claude plugin zip on a
# GitHub release whenever they change on main. The version bump rules are in scripts/claude-plugin.sh.
name: Claude plugin

on:
  push:
    branches: [main]
    paths:
      - skills/**
      - scripts/claude-plugin.sh
  workflow_dispatch:

permissions:
  contents: write # creates the claude-plugin-v* tag and the release

# Two pushes in a row must not compute the same version.
concurrency:
  group: claude-plugin
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from the last claude-plugin-v* tag

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/claude-plugin.sh version
          scripts/claude-plugin.sh release
